name: build

on:
  push:
    branches: [master, main]
  pull_request:
  # automerge.yml starts this on a pull request's branch after merging main into it: GitHub runs no workflow for a
  # push made with a workflow's own token.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  # The server VM's scripts: the deploy of main and the staging server, each played through on a made-up origin with a
  # stand-in for docker.
  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/auto-deploy-test.sh
      - run: deploy/staging-test.sh

  # The workflow scripts (.github/scripts): the merge conflict check (mergeable.yml) and the alert issues
  # (probe.yml, pin-health.yml) against a stand-in for GitHub's API, and the odinsgate probe against a status page
  # and a game port on loopback.
  mergeable-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/*.test.js

  # The launcher's version file against the pull request (.github/scripts/launcher-version.js): a change to the pin
  # table or the server's modulus bumps it, and a bump is newer than the last and not released yet.
  launcher-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node .github/scripts/launcher-version.js "origin/${{ github.base_ref }}" HEAD

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p launcher build
      # The installed layout (bin/ and lib/), what the test VM runs from C:\RSPS\launcher\app.
      - uses: actions/upload-artifact@v4
        with:
          name: odinsgate-launcher
          path: launcher/build/install/odinsgate-launcher/
          if-no-files-found: error

  # The VM's launch scripts: the parts that need no VM, run with PowerShell 7 on Linux.
  launch-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File test-runner/launch/start-client-functions.tests.ps1

  tick-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p tick-recorder build
      - uses: actions/upload-artifact@v4
        with:
          name: tick-recorder-jar
          path: tick-recorder/build/libs/*.jar
          if-no-files-found: error

  test-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p test-runner build
      - uses: actions/upload-artifact@v4
        with:
          name: test-runner-jar
          path: test-runner/build/libs/*.jar
          if-no-files-found: error
