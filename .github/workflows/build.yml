name: build

on:
  push:
    branches: [master, main]
  pull_request:
  # automerge.yml starts this on a pull request's branch after merging main into it: GitHub runs no workflow for a
  # push made with a workflow's own token.
  workflow_dispatch:

# The jobs' names are the checks the ruleset on main requires: a job split up keeps its name on a job that waits for
# the parts (`build`), and a job that sits a change out is skipped, which counts as passing. A skipped matrix job
# shows under the job's bare name instead of each matrix name, so installer-mac runs and skips its steps instead.
jobs:
  # Which parts of the repository the change touches, against main (the pull request's base): the launcher and
  # installer jobs, tick-recorder and test-runner sit out a change that touches nothing they build from. A push to main
  # runs everything, so main's artifacts and Gradle caches are always whole.
  changes:
    runs-on: ubuntu-latest
    outputs:
      launcher: ${{ steps.paths.outputs.launcher }}
      tick-recorder: ${{ steps.paths.outputs.tick-recorder }}
      test-runner: ${{ steps.paths.outputs.test-runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            printf '%s\n' launcher=true tick-recorder=true test-runner=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          printf '%s\n' "$changed"
          shared='^(gradle/|gradlew|\.github/workflows/build\.yml$|\.github/actions/)'
          touches() { if grep -qE "$1|$shared" <<<"$changed"; then echo true; else echo false; fi; }
          {
            echo "launcher=$(touches '^launcher/|^src/main/resources/(runelite-pins\.json|rsa-modulus\.txt)$')"
            echo "tick-recorder=$(touches '^tick-recorder/')"
            echo "test-runner=$(touches '^test-runner/')"
          } | tee -a "$GITHUB_OUTPUT"

  # The server's tests in five parts at once (build.gradle.kts, -PtestShard), each with the whole build around them.
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --build-cache -PtestShard=${{ matrix.shard }}/5

  # The server's build and every one of its tests: passes when each part above did. Also fails when `changes` did,
  # since the jobs that wait on it would be skipped, and a skipped job counts as passing.
  build:
    needs: [changes, server-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.server-tests.result }}
        run: |
          echo "changes: $CHANGES, server-tests: $TESTS"
          [[ $CHANGES == success && $TESTS == success ]]

  # The server VM's scripts: the deploy of main and the staging server, each played through on a made-up origin with a
  # stand-in for docker.
  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/auto-deploy-test.sh
      - run: deploy/staging-test.sh

  # The workflow scripts (.github/scripts): the merge conflict check (mergeable.yml) and the alert issues
  # (probe.yml, pin-health.yml) against a stand-in for GitHub's API, the odinsgate probe against a status page
  # and a game port on loopback, and the friend page checks on made-up pages and the real docs/.
  mergeable-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/*.test.js

  # The friend download page and guides (docs/, GitHub Pages; README.md, "Letting friends test"): every link is
  # https to a known host or a file in docs/, every download button names an installer the launcher's Names.java
  # knows, each exactly once, and no page carries a banned word (.github/scripts/friend-page.js).
  friend-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/friend-page.js

  # The launcher's version file against the pull request (.github/scripts/launcher-version.js): a change to the pin
  # table or the server's modulus bumps it, and a bump is newer than the last and not released yet.
  # Also on automerge.yml's dispatched runs, against main: merging main in can drop a pull request's bump when main
  # took the same version.
  launcher-version:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node .github/scripts/launcher-version.js "origin/${{ github.base_ref || 'main' }}" HEAD

  launcher:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p launcher build --build-cache
      # The installed layout (bin/ and lib/), what the test VM runs from C:\RSPS\launcher\app.
      - uses: actions/upload-artifact@v4
        with:
          name: odinsgate-launcher
          path: launcher/build/install/odinsgate-launcher/
          if-no-files-found: error

  # The launcher's tests on Windows, where friends run it: the same build as above, with nothing uploaded.
  launcher-windows:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: ./gradlew -p launcher build --build-cache

  # The Windows installer (launcher/README.md, "Installers"): the app image over a runtime that keeps bin/java, the
  # installer around it, the image's self-test and scan, and an install, self-test and uninstall of the installer on
  # the runner. The artifact is the installer, which a test VM installs.
  installer-windows:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-installer
      - uses: actions/upload-artifact@v4
        with:
          name: OdinsGate-Setup
          path: launcher/build/installer/OdinsGate-Setup.exe
          if-no-files-found: error

  # The Mac disk images, one per chip (launcher/README.md, "Installers"): the app image, its self-test and scan, the
  # disk image, and a copy of the app from it self-tested as a friend would run it.
  installer-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            chip: arm64
          - os: macos-15-intel
            chip: x64
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUN: ${{ needs.changes.outputs.launcher }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@v4
      - if: env.RUN == 'true'
        uses: ./.github/actions/mac-installer
      - if: env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OdinsGate-mac-${{ matrix.chip }}
          path: launcher/build/installer/OdinsGate-mac-${{ matrix.chip }}.dmg
          if-no-files-found: error

  # The Linux archive (launcher/README.md, "Installers"): the app image, its self-test and scan, the tar.gz, and a
  # copy extracted from it self-tested under a virtual display, so the window opens on a runner too.
  installer-linux:
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-tarball
      - uses: actions/upload-artifact@v4
        with:
          name: OdinsGate-linux-x64
          path: launcher/build/installer/OdinsGate-linux-x64.tar.gz
          if-no-files-found: error

  # The VM's launch scripts: the parts that need no VM, run with PowerShell 7 on Linux.
  launch-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File test-runner/launch/start-client-functions.tests.ps1

  tick-recorder:
    needs: changes
    if: needs.changes.outputs.tick-recorder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p tick-recorder build --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: tick-recorder-jar
          path: tick-recorder/build/libs/*.jar
          if-no-files-found: error

  test-runner:
    needs: changes
    if: needs.changes.outputs.test-runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p test-runner build --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: test-runner-jar
          path: test-runner/build/libs/*.jar
          if-no-files-found: error
