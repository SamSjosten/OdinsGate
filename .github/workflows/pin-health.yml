name: pin-health
# Does every RuneLite pin still hold? Weekly, and on a pull request that touches the pin table or the check itself,
# `./gradlew -p launcher pinHealth` (launcher/src/main/java/net/odinsgate/launcher/PinHealth.java) checks each pin in
# src/main/resources/runelite-pins.json against RuneLite's servers: the bootstrap still carries the pinned SHA-256 and
# RuneLite's signature, every jar it names answers a HEAD request with its size, and RuneLite's runtime config doesn't
# list the pinned client version as outdated. HEAD only: no RuneLite jar is ever downloaded or cached here. A scheduled
# run that fails opens one issue, "A RuneLite pin is no longer healthy", assigned to the repository's owner
# (.github/scripts/alert.js, CONTRIBUTING.md); a pull request run that fails is a failing check and nothing more.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - src/main/resources/runelite-pins.json
      - launcher/src/main/java/net/odinsgate/launcher/PinHealth.java
      - launcher/src/main/java/net/odinsgate/launcher/RuneLiteCache.java
      - launcher/src/main/java/net/odinsgate/launcher/RuneLiteSignature.java
      - launcher/src/main/java/net/odinsgate/launcher/Bootstrap.java
      - launcher/src/main/resources/net/odinsgate/launcher/runelite.crt
      - launcher/build.gradle
      - .github/workflows/pin-health.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: pin-health-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false
jobs:
  pin-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - id: check
        # On a pull request the failing step fails the check; on a schedule the alert step below reports it.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: ./gradlew -q -p launcher pinHealth | tee pin-health.txt
      - uses: actions/github-script@v7
        if: always() && github.event_name != 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const lines = fs.existsSync('pin-health.txt') ? fs.readFileSync('pin-health.txt', 'utf8').trim() : '';
            const failed = lines.split('\n').filter(line => /^(FAIL|pin health)/.test(line));
            await require('./.github/scripts/alert.js')({ github, context, core }, {
              key: 'pin-health',
              title: 'A RuneLite pin is no longer healthy',
              healthy: '${{ steps.check.outcome }}' === 'success',
              detail: (failed.length ? failed : lines.split('\n').slice(-5)).join('\n'),
            });
