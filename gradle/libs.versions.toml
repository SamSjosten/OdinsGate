[versions]
kotlin = "2.4.21"
rsprot = "1.0.0-ALPHA-20261014"
kotlin-logging = "8.0.4"
logback = "1.6.5"
junit = "6.1.3"
displee-cache = "8.1.0"
kotlinx-serialization = "1.11.0"

[libraries]
rsprot-api = { module = "net.rsprot:osrs-241-api", version.ref = "rsprot" }
rsprot-desktop = { module = "net.rsprot:osrs-241-desktop", version.ref = "rsprot" }
displee-cache = { module = "com.displee:rs-cache-library", version.ref = "displee-cache" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
